# Скопируйте в server {} или location для Mini App (прокси на Node).
# 504 при составлении программы возникает, если прокси обрывает долгий ответ.
# После правки: nginx -t && systemctl reload nginx

proxy_read_timeout 600s;
proxy_send_timeout 600s;
send_timeout 600s;

# Для SSE (program-description-stream) отключить буферизацию
proxy_buffering off;
proxy_http_version 1.1;
proxy_set_header Connection "";
